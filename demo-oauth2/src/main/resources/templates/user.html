<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile</title>
</head>
<body>
<h1>Профиль пользователя</h1>

<ul>
    <li><strong>Name:</strong> <span th:text="${name}">Name</span></li>
    <li><strong>Login:</strong> <span th:text="${login}">login</span></li>
    <li><strong>ID:</strong> <span th:text="${id}">id</span></li>
    <li><strong>Email:</strong> <span th:text="${email}">email</span></li>
    <li><strong>Role:</strong> <span th:text="${role}">ROLE_USER</span></li>
</ul>

<p>
    <a href="/admin">Admin page</a> |
    <a href="/logout">Logout</a>
</p>

</body>
</html>
