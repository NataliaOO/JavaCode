spring:
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
  properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
server:
  error:
    include-message: always